                <form id="register-form" class="auth-form">
                    <div class="form-group">
                        <label for="register-username">

                        <input type="text" id="register-username" placeholder="2-20个字符，支持中英文、数字、下划线" required autocomplete="username" minlength="2" maxlength="20">
                    </div>

                    <div class="form-group">
                        <label for="register-email">

                    <div class="form-group">
                        <label for="register-password">

                        </label>
                        <input type="password" id="register-password" placeholder="至少 6 个字符" required autocomplete="new-password" minlength="6">
                    </div>

                    <div class="form-group">
                        <label for="register-password2">
                            <i class="fas fa-check-circle"></i> 确认密码
                        </label>
                        <input type="password" id="register-password2" placeholder="请再次输入密码" required autocomplete="new-password" minlength="6">

    <script type="module">
        import { initTheme, bindThemeToggle } from './js/theme.js';
        import { initSmoothScroll, initErrorHandling } from './js/ui.js';
        import { register, isLoggedIn } from './js/auth.js';
        import { sha256 } from './js/crypto.js';
        import { showToast } from './js/ui.js';

        initTheme();
        bindThemeToggle();
        initSmoothScroll();
        initErrorHandling();

        // 初始化汉堡菜单
        const hamburgerBtn = document.getElementById('hamburger-btn');
        if (hamburgerBtn) {
            hamburgerBtn.addEventListener('click', () => {
                document.body.classList.toggle('nav-open');
            });
        }

        // 已登录则跳转个人中心
        if (isLoggedIn()) {
            window.location.href = '/profile.html';
        }

        // ===== hCaptcha 人机验证（脚本加载失败时降级为本地算术题） =====
        const HCAPTCHA_SITE_KEY = '6032461a-efd2-45d0-8696-a7f8e1c6f682';
        let hcaptchaWidgetId = null;
        let hcaptchaReady = false;
        let fallbackAnswer = null;

        function getHCaptchaTheme() {
            const html = document.documentElement;
            if (html.classList.contains('dark-theme')) return 'dark';
            return 'light';
        }

        function useFallbackCaptcha() {
            const container = document.getElementById('hcaptcha-container');
            if (!container) return;
            // 两位数算术题（10~99）
            const a = Math.floor(Math.random() * 90) + 10;
            const b = Math.floor(Math.random() * 90) + 10;
            fallbackAnswer = a + b;
            const aStr = a.toString().padStart(2, '0');
            const bStr = b.toString().padStart(2, '0');
            const tokenKey = 'ctmc_cap_' + Math.random().toString(36).slice(2, 10);
            sessionStorage.setItem(tokenKey, JSON.stringify({ a, b, issuedAt: Date.now() }));
            container.innerHTML = `
                <div class="captcha-fallback">
                    <span>请计算：</span>
                    <strong data-captcha-key="${tokenKey}">${aStr} + ${bStr} = </strong>
                    <input type="text" id="captcha-fallback-input" inputmode="numeric" autocomplete="off" maxlength="3" placeholder="??" />
                </div>
            `;
        }

        async function initHCaptcha() {
            const isLocalhost = location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.hostname === '::1';
            if (isLocalhost) { useFallbackCaptcha(); return; }

            const timeout = setTimeout(() => {
                if (!hcaptchaReady) {
                    console.warn('[hCaptcha] 脚本加载超时，降级为算术验证');
                    useFallbackCaptcha();
                }
            }, 6000);

            return new Promise((resolve) => {
                if (window.hcaptcha) { hcaptchaReady = true; renderHCaptcha(); clearTimeout(timeout); resolve(); return; }
                const script = document.createElement('script');
                // 优先本地缓存，失败回退 CDN，最后降级为算术题
                script.src = 'vendor/hcaptcha/api.js?render=explicit&onload=hcaptchaOnLoad';
                script.async = true;
                script.defer = true;
                script.onerror = () => {
                    const s2 = document.createElement('script');
                    s2.src = 'https://js.hcaptcha.com/1/api.js?render=explicit&onload=hcaptchaOnLoad';
                    s2.onerror = () => { clearTimeout(timeout); if (!hcaptchaReady) { useFallbackCaptcha(); resolve(); } };
                    document.head.appendChild(s2);
                };
                window.hcaptchaOnLoad = () => { hcaptchaReady = true; clearTimeout(timeout); renderHCaptcha(); resolve(); };
                document.head.appendChild(script);
            });
        }

        function renderHCaptcha() {
            if (hcaptchaWidgetId !== null) { hcaptcha.reset(hcaptchaWidgetId); return; }
            hcaptchaWidgetId = hcaptcha.render('hcaptcha-container', {
                sitekey: HCAPTCHA_SITE_KEY,
                theme: getHCaptchaTheme(),
                size: 'normal',
            });
        }

        function getHCaptchaToken() {
            if (hcaptchaReady && hcaptchaWidgetId !== null) {
                return hcaptcha.getResponse(hcaptchaWidgetId) || '';
            }
            // 校验：1) 答案正确 2) 答题耗时 ≥ 1.5s 3) tokenKey 存在
            const input = document.getElementById('captcha-fallback-input');
            const strong = document.querySelector('.captcha-fallback strong');
            if (!input || !strong || fallbackAnswer === null) return '';
            const val = parseInt(input.value, 10);
            if (val !== fallbackAnswer) return '';
            const tokenKey = strong.dataset.captchaKey;
            if (!tokenKey) return '';
            const record = JSON.parse(sessionStorage.getItem(tokenKey) || 'null');
            if (!record) return '';
            const elapsed = Date.now() - (record.issuedAt || 0);
            if (elapsed < 1500) { showToast('请稍后再试', { type: 'error' }); useFallbackCaptcha(); return ''; }
            if (elapsed > 5 * 60 * 1000) { useFallbackCaptcha(); return ''; }
            sessionStorage.removeItem(tokenKey);
            return 'fallback_ok';
        }

        function resetHCaptcha() {
            if (hcaptchaReady && hcaptchaWidgetId !== null) {
                hcaptcha.reset(hcaptchaWidgetId);
            } else {
                useFallbackCaptcha();
            }
        }

        window.addEventListener('themechange', () => {
            if (hcaptchaReady && hcaptchaWidgetId !== null) {
                hcaptcha.reset(hcaptchaWidgetId);
            }
        });

        initHCaptcha();

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('register-btn');
            if (btn.disabled) return;
            const username = document.getElementById('register-username').value.trim();
            const email = document.getElementById('register-email').value.trim();
            const password = document.getElementById('register-password').value;
            const password2 = document.getElementById('register-password2').value;

            if (!username || !email || !password) { showToast('请填写所有字段', { type: 'error' }); return; }
            if (password !== password2) { showToast('两次输入的密码不一致', { type: 'error' }); return; }

            // 获取 hCaptcha token（含算术题降级校验）
            const hcaptchaToken = getHCaptchaToken();
            if (!hcaptchaToken) { showToast('请完成人机验证', { type: 'error' }); return; }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 注册中...';

            try {
                const hashedPassword = await sha256(password);
                await register(username, email, hashedPassword, '', hcaptchaToken);
                showToast('注册成功！请登录');
                setTimeout(() => { window.location.href = '/login.html'; }, 800);
            } catch (err) {
                showToast(err.message, { type: 'error' });
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-user-plus"></i> 注册';
            } finally {
                resetHCaptcha();
            }
        });
    </script>
